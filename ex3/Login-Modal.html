<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Horizontal Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/all.min.css">
    </head>

    <body>
        <div class="container mt-5">
            <div class="col-auto">
                <h4>Mở biểu mẫu đăng nhập</h4>
                <button type="button" class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#loginModal">Mở
                    hộp thoại</button>
            </div>
            <form class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header justify-content-center">
                            <div class="align-items-end d-flex gap-2">
                                <i class="fas fa-lock fa-2x lh-1 me-1"></i>
                                <span class="lh-1 fs-2">Đăng nhập</span>
                                <button type="button" class="btn-close position-absolute top-0 end-0 m-3"
                                    data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                        </div>
                        <div class="modal-body">
                            <div>
                                <i class="fas fa-user"></i>
                                <span class="fw-bold ms-1">Người dùng:</span>
                                <input type="text" class="form-control mt-1" placeholder="Nhập tên người dùng">
                            </div>
                            <div class="mt-3">
                                <i class="fas fa-eye"></i>
                                <span class="fw-bold ms-1">Mật khẩu:</span>
                                <input type="password" class="form-control mt-1" placeholder="Nhập mật khẩu">
                            </div>
                            <div class="mt-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mt-3">
                                <i class="fas fa-power-off"></i>
                                Đăng nhập
                            </button>
                        </div>
                        <div class="modal-footer justify-content-between">
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Hủy bỏ</button>
                            <div class="text-end">
                                <div class="text-muted">Bạn chưa phải là thành viên? <a href="#">Đăng ký</a></div>
                                <div class="text-muted mt-1">Quên <a href="#">mật khẩu?</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
