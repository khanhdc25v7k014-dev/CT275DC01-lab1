<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Vertical Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/all.min.css">
    </head>

    <body>
        <form class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-9">
                    <div class="card border-1 border-primary-subtle">
                        <div class="card-header bg-primary text-white py-3 ps-4 fw-bold">
                            Biểu mẫu đăng nhập
                        </div>
                        <div class="card-body bg-white pt-4">
                            <div class="row align-items-center justify-content-center gx-3">
                                <div class="col-3">
                                    <div class="input-group">
                                        <span class="input-group-text border border-secondary-subtle bg-secondary-subtle">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="input-group">
                                        <span class="input-group-text border border-secondary-subtle bg-secondary-subtle">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="Nhập vào mật khẩu">
                                    </div>
                                </div>
                                <div class="col-auto">
                                    <div class="input-group">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="rememberMe">
                                            <label class="form-check-label" for="rememberMe">Ghi nhớ tôi</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-auto">
                                    <div class="input-group">
                                        <button type="submit" class="btn btn-primary">Đăng nhập</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </body>

</html>
