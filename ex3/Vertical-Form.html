<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Vertical Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <form class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card border-1 border-info-subtle">
                        <div class="card-header text-info-emphasis border-bottom border-info-subtle bg-info-subtle">
                            Biểu mẫu đăng nhập
                        </div>
                        <div class="card-body bg-white">
                            <div>
                                <label for="email" class="form-label fw-bold">Email:</label>
                                <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
                            </div>
                            <div class="mt-3">
                                <label for="password" class="form-label fw-bold">Password:</label>
                                <input type="password" class="form-control" id="password" placeholder="Nhập vào mật khẩu">
                            </div>
                            <div class="mt-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-primary">Đăng nhập</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </body>

</html>
